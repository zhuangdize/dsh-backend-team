openapi: 3.1.0
info:
  title: Backend API
  version: 1.0.0
  description: Versioned HTTP contract for the feature backend.
servers:
  - url: https://api.example.invalid/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
